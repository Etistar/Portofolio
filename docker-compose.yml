version: '3.8'

services:
  # 🗄️ Service 1 : La base de données MongoDB locale
  mongo_db:
    image: mongo:latest
    container_name: portfolio_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # 💻 Service 2 : Le serveur Node.js Backend
  backend:
    build: .
    container_name: portfolio_backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://mongo_db:27017/Portfolio
      - PORT=5000
    depends_on:
      - mongo_db

  # ⚛️ Service 3 : L'interface React Frontend (Votre site)
  frontend:
    build: ./client
    container_name: portfolio_frontend
    ports:
      - "5173:5173" 
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - backend
    stdin_open: true 
    tty: true

volumes:
  mongo_data:
